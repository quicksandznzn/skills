name: Sync upstream skills

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Sync mirrors
        run: python3 scripts/sync_upstreams.py | tee "$RUNNER_TEMP/sync-summary.md"
      - name: Validate discovery
        run: |
          python3 scripts/sync_upstreams.py --check
          npx --yes skills@1.5.23 add . --list
      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          BRANCH: feat/sync-upstreams
          PR_TITLE: "chore: sync upstream skills"
        run: |
          number="$(gh pr list --base main --state open --head "$BRANCH" --json number --jq '.[0].number')"
          if git diff --quiet; then
            echo "No upstream changes."
            if [ -n "$number" ]; then
              gh pr close "$number"
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add skills upstreams.json docs/upstreams.md
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          {
            echo "Automated upstream updates, regenerated from the latest main on each run."
            echo
            echo "## Changes"
            echo
            cat "$RUNNER_TEMP/sync-summary.md"
            echo
            echo "All pending skill updates are collected in this pull request. Review the upstream changes before merging."
            echo "See [upstream sources](https://github.com/$GITHUB_REPOSITORY/blob/$BRANCH/docs/upstreams.md) for the pinned versions."
          } > "$RUNNER_TEMP/pr-body.md"

          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
